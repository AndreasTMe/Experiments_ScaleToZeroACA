# Service Bus emulator for local runs. Needs MSSQL_SA_PASSWORD in local/.env, which git ignores.
# ACCEPT_EULA accepts the licence terms of the emulator and SQL Server Linux:
# https://github.com/Azure/azure-service-bus-emulator-installer/blob/main/EMULATOR_EULA.txt
# https://go.microsoft.com/fwlink/?LinkId=746388
#
# The workers are behind the "workers" profile. Start everything with:
#   docker compose -f local/compose.yaml --profile workers up -d --build
name: scale-to-zero-local

# Shared by the four workers. Each sets its variant, which is also the name of its queue and its build target.
x-worker: &worker
  profiles: [workers]
  # The emulator has no healthcheck, so a worker can start before it's ready, fail to open its done sender, and exit.
  # Restarting until the emulator answers is enough for local runs.
  restart: on-failure
  depends_on:
    - emulator

# The emulator's fixed connection string. SAS_KEY_VALUE is a literal placeholder, not a secret.
x-worker-environment: &worker-environment
  SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
  WORKER_DONE_QUEUE: done

services:
  emulator:
    # The image has no shell, so it can't have a Docker healthcheck. Readiness: GET http://localhost:5300/health
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.0@sha256:a00c9626c8960f6b9be6178aa91a7ac8f1a102c0d9deda7603a1ba0ac9d9ab51
    volumes:
      - ./emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set it in local/.env}
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: "5300"
    depends_on:
      mssql:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set it in local/.env}
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  worker-jit:
    <<: *worker
    image: scale-to-zero-worker:jit
    build:
      context: ..
      dockerfile: src/Worker/Dockerfile
      target: jit
    environment:
      <<: *worker-environment
      WORKER_VARIANT: jit
      WORKER_QUEUE: jit

  worker-r2r:
    <<: *worker
    image: scale-to-zero-worker:r2r
    build:
      context: ..
      dockerfile: src/Worker/Dockerfile
      target: r2r
    environment:
      <<: *worker-environment
      WORKER_VARIANT: r2r
      WORKER_QUEUE: r2r

  worker-aot:
    <<: *worker
    image: scale-to-zero-worker:aot
    build:
      context: ..
      dockerfile: src/Worker/Dockerfile
      target: aot
    environment:
      <<: *worker-environment
      WORKER_VARIANT: aot
      WORKER_QUEUE: aot

  worker-jit-chiseled:
    <<: *worker
    image: scale-to-zero-worker:jit-chiseled
    build:
      context: ..
      dockerfile: src/Worker/Dockerfile
      target: jit-chiseled
    environment:
      <<: *worker-environment
      WORKER_VARIANT: jit-chiseled
      WORKER_QUEUE: jit-chiseled
